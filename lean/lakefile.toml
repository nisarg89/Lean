name = "fairdivision"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FairDivision"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.whitespace = false
maxSynthPendingDepth = 3

# Exact BF-only requirements; all revisions match the accepted server lockfile.

[[require]]
name = "dkgm_topology_source"
path = "third_party/dkgm-topology-source"

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "dfa4f38190d07c37e315953e08b90fe2d95b3c24"

[[require]]
name = "LeanSearchClient"
git = "https://github.com/leanprover-community/LeanSearchClient"
rev = "d6b4c7be5be75ec4917c873ac50c756dc1436372"

[[require]]
name = "importGraph"
git = "https://github.com/leanprover-community/import-graph"
rev = "a41f0e9a4dea23188ea9cc1c41ac9f8bbafe0b93"

[[require]]
name = "proofwidgets"
git = "https://github.com/leanprover-community/ProofWidgets4"
rev = "df72b022e558978a1c50264cfc4d7fec86fa8e04"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "4a174c490d8707121c4a9290800489f105d85e07"

[[require]]
name = "Qq"
git = "https://github.com/leanprover-community/quote4"
rev = "dce0ad79c486cb1fb504af04f953c3466b0c6db8"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "66e469188fe07963e5cf666c7d4433f45b8131c5"

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "c24fe6078c630e89b489bffe59b3e20ac30d12c8"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "FairDivision"
# Statement challenges are separate from the default proof target.
[[lean_lib]]
name = "ComparatorChallenges"
globs = ["ComparatorChallenges.+"]
